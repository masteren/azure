<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}テスト前お助け掲示板{% endblock %}</title>
    <style>
        :root { --main: #2b7a78; --accent: #f4a261; --bg: #f7f9f9; --line: #dde3e3; --muted: #667; }
        * { box-sizing: border-box; }
        body { font-family: "Hiragino Sans", "Noto Sans JP", sans-serif; max-width: 760px; margin: 0 auto; padding: 0 16px 48px; color: #222; background: var(--bg); line-height: 1.6; }
        header { padding: 20px 0 8px; }
        header a { color: inherit; text-decoration: none; }
        header h1 { margin: 0; color: var(--main); font-size: 1.6em; }
        header p { margin: 2px 0 0; color: var(--muted); font-size: 0.9em; }
        .flash { background: #fff4ce; border: 1px solid #e0c060; padding: 8px 12px; border-radius: 8px; margin: 12px 0; }
        .card { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin: 12px 0; }
        input, select, textarea { width: 100%; padding: 8px; font-size: 1em; border: 1px solid #bcc; border-radius: 6px; font-family: inherit; }
        textarea { min-height: 90px; }
        label { font-size: 0.85em; color: var(--muted); display: block; margin-top: 8px; }
        button, .btn { padding: 8px 16px; background: var(--main); color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 1em; text-decoration: none; display: inline-block; }
        button.sub { background: #fff; color: var(--main); border: 1px solid var(--main); }
        button:disabled { background: #ccc; border-color: #ccc; color: #fff; cursor: default; }
        .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
        .tag { display: inline-block; padding: 0 8px; border-radius: 999px; font-size: 0.8em; background: #e3f1f0; color: var(--main); }
        .tag.solved { background: #2b7a78; color: #fff; }
        .tag.soon { background: #fde2cf; color: #b4501b; font-weight: bold; }
        .meta { color: var(--muted); font-size: 0.85em; }
        .post-img { max-width: 100%; max-height: 420px; border-radius: 8px; margin-top: 8px; display: block; }
        .body { white-space: pre-wrap; word-break: break-word; }
        a { color: var(--main); }
        @media (max-width: 520px) { .grid2 { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <header>
        <a href="{{ url_for('index') }}"><h1>📚 テスト前お助け掲示板</h1></a>
        <p>わからない問題を、同じ学校の仲間と教え合おう</p>
    </header>

    {% for msg in get_flashed_messages() %}
    <div class="flash">{{ msg }}</div>
    {% endfor %}

    {% block content %}{% endblock %}
</body>
</html>
